# Glossary shown as popups over terms in the page text (first mention per page).
# Summaries are definitions only — no instructions or calls to action.
# match: regular expressions (case-insensitive, whole words); \p{L}* lets Russian word endings vary.
# code:  exact inline-code values (e.g. `url`) that get the same popup.
# ref:   page the "→" link points to (+ optional anchor).

ru:
  - term: Первый запуск
    match: ['перв\p{L}* запуск\p{L}*']
    summary: Первый запуск приложения после установки, на котором по ответу конфига определяется режим работы — WebView или фантик.
    ref: user-flow
  - term: Режим WebView
    match: ['режим\p{L}* WebView']
    summary: Режим работы, в котором приложение показывает сайт по ссылке из конфига. Устанавливается по положительному ответу на первом запуске.
    ref: user-flow
  - term: Фантик
    match: ['фантик\p{L}*']
    summary: Режим работы с собственным контентом приложения (игра или другой контент). Устанавливается по отрицательному ответу на первом запуске и не зависит от наличия сети.
    ref: user-flow
  - term: Заглушка «Нет интернета»
    match: ['заглушк\p{L}*']
    summary: Экран, отображаемый при отсутствии соединения на первом запуске или в режиме WebView.
    ref: user-flow
  - term: Экран загрузки
    match: ['экран\p{L}* загрузки']
    summary: Экран, отображаемый во время загрузки приложения, с анимированным индикатором загрузки.
    ref: app-requirements
  - term: Запрос к конфигу
    match: ['запрос\p{L}* к конфигу']
    summary: POST-запрос на эндпоинт с данными конверсии AppsFlyer, параметрами приложения, данными Firebase и deep linking.
    ref: config-request
  - term: Конфиг
    match: ['конфиг\p{L}*']
    summary: Серверная логика приложения — авторизация пользователя в системе уведомлений и выдача актуальной ссылки для WebView.
    ref: config-request
  - term: Эндпоинт
    match: ['эндпоинт\p{L}*']
    summary: Адрес конфига, на который отправляется запрос.
    ref: config-request
  - term: Положительный / отрицательный ответ
    match: ['положительн\p{L}* ответ\p{L}*', 'отрицательн\p{L}* ответ\p{L}*']
    summary: 'Положительный — ответ конфига с кодом `200`, содержащий `url`. Отрицательный — любой другой ответ, включая ошибку сети и превышение лимита ожидания.'
    ref: config-request
  - term: url
    code: [url]
    summary: Актуальная ссылка для WebView из ответа конфига.
    ref: config-request
  - term: expires
    code: [expires]
    summary: Время окончания срока действия ссылки из ответа конфига.
    ref: config-request
  - term: Данные конверсии
    match: ['данн\p{L}* конверсии']
    summary: Параметры источника установки, которые AppsFlyer SDK возвращает в колбеке.
    ref: config-request
  - term: Органическая / неорганическая установка
    match: ['неорганическ\p{L}*', 'органическ\p{L}*']
    summary: 'Тип установки по полю `af_status`: органическая — без рекламного источника, неорганическая (`Non-organic`) — по рекламному переходу.'
    ref: config-request
  - term: AppsFlyer
    match: ['AppsFlyer']
    summary: Сервис атрибуции мобильных установок.
    ref: config-request
  - term: af_id (AppsFlyer ID)
    code: [af_id]
    summary: Идентификатор установки, генерируемый AppsFlyer SDK при инициализации.
    ref: config-request
  - term: Трекинговая ссылка
    match: ['трекингов\p{L}* ссылк\p{L}*']
    summary: Ссылка AppsFlyer, фиксирующая переход пользователя для атрибуции установки.
    ref: app-requirements
  - term: GAID / IDFA
    match: ['GAID', 'IDFA', 'Test Devices']
    summary: 'Рекламные идентификаторы устройства: GAID — Android, IDFA — iOS. Test Devices — список тестовых устройств в аккаунте AppsFlyer.'
    ref: app-requirements
  - term: OneLink
    match: ['OneLink']
    summary: Тип ссылок AppsFlyer с поддержкой deep linking, работающий на разных платформах.
    ref: onelink
  - term: Unified Deep Linking (UDL)
    match: ['Unified Deep Linking', 'UDL', 'deep linking']
    summary: 'Механизм AppsFlyer, передающий в приложение данные ссылки, по которой оно было установлено или открыто (`deep_link_value` и др.).'
    ref: config-request
  - term: bundle_id
    code: [bundle_id]
    summary: 'Идентификатор приложения: Bundle ID (iOS) или Package Name (Android), например `com.example.app`.'
    ref: config-request
  - term: store_id
    code: [store_id]
    summary: 'Идентификатор приложения в сторе. Для iOS — Apple ID с префиксом `id`, для Android совпадает с `bundle_id`.'
    ref: config-request
  - term: locale
    code: [locale]
    summary: Основная локализация устройства пользователя.
    ref: config-request
  - term: Firebase Cloud Messaging (FCM)
    match: ['Firebase Cloud Messaging', 'Firebase Messaging', 'FCM']
    summary: Сервис Google для доставки push-уведомлений.
    ref: notifications
  - term: push_token
    code: [push_token]
    summary: Токен регистрации устройства в Firebase Messaging.
    ref: config-request
  - term: firebase_project_id
    code: [firebase_project_id]
    summary: 'Идентификатор проекта Firebase: Project number или Project ID.'
    ref: config-request
  - term: Сервисный аккаунт
    match: ['сервисн\p{L}* аккаунт\p{L}*']
    summary: 'Аккаунт Google Cloud, через который внешний сервис получает доступ к проекту Firebase. Для уведомлений используются `marla-export@…` и `iosandroidpushes@…`.'
    ref: notifications
  - term: Кастомный экран запроса уведомлений
    match: ['кастомн\p{L}* экран\p{L}*']
    summary: Собственный экран приложения с предложением получать уведомления, предшествующий системному запросу разрешения.
    ref: notifications
  - term: Payload уведомления
    match: ['payload']
    code: [payload]
    summary: 'Содержимое push-уведомления; в поле `data` может передаваться ссылка `url`.'
    ref: notifications
  - term: User agent
    match: ['user agent', 'юзерагент\p{L}*']
    summary: Строка, которой WebView представляется сайтам, — сведения о браузере, операционной системе и устройстве.
    ref: app-requirements
    anchor: user-agent
  - term: Safe Area
    match: ['Safe Area']
    summary: Область экрана, в которой контент не перекрывается рамками, камерой и системными элементами.
    ref: app-requirements
  - term: ERR_TOO_MANY_REDIRECTS
    code: [ERR_TOO_MANY_REDIRECTS]
    summary: Ошибка загрузки страницы при превышении допустимого числа редиректов.
    ref: app-requirements
  - term: Protected Media ID
    match: ['Protected Media ID']
    summary: Разрешение, запрашиваемое страницей для воспроизведения защищённого медиаконтента.
    ref: app-requirements
  - term: Диплинк
    match: ['диплинк\p{L}*']
    summary: Ссылка, открывающая другое приложение или определённый экран в нём.
    ref: app-requirements
  - term: Тестовый оффер
    match: ['тестов\p{L}* оффер\p{L}*']
    summary: Ресурс web.team-s.club для частичной проверки WebView и логики приложения.
    ref: app-requirements
  - term: Адаптивная иконка
    match: ['адаптивн\p{L}* иконк\p{L}*']
    summary: Иконка приложения, изображение которой точно вписано в её форму — без полей и без обрезанного контента.
    ref: app-requirements
  - term: 16 KB page sizes
    match: ['16 KB page sizes', '16 ?КБ']
    summary: Размер страницы памяти 16 КБ, поддержка которого требуется Google Play с 1 ноября 2025 г. для приложений под Android 15+.
    ref: changelog/android-requirements

en:
  - term: First launch
    match: ['first launch']
    summary: The first launch of the app after install, on which the config response determines the mode — WebView or stub.
    ref: user-flow
  - term: WebView mode
    match: ['WebView mode']
    summary: The mode in which the app shows a website from the config link. Set by a positive response on first launch.
    ref: user-flow
  - term: Stub
    match: ['stubs?']
    summary: The mode with the app's own content (a game or other content). Set by a negative response on first launch; does not depend on the network.
    ref: user-flow
  - term: '"No internet" placeholder'
    match: ['placeholder']
    summary: The screen shown when there is no connection on first launch or in WebView mode.
    ref: user-flow
  - term: Loading screen
    match: ['loading screens?']
    summary: The screen shown while the app is loading, with an animated loading indicator.
    ref: app-requirements
  - term: Config request
    match: ['config requests?']
    summary: A POST request to the endpoint with AppsFlyer conversion data, app parameters, Firebase and deep linking data.
    ref: config-request
  - term: Config
    match: ['config']
    summary: The server-side app logic — registering the user in the notification system and providing the current WebView link.
    ref: config-request
  - term: Endpoint
    match: ['endpoints?']
    summary: The config address the request is sent to.
    ref: config-request
  - term: Positive / negative response
    match: ['positive response', 'negative response']
    summary: 'Positive — a config response with code `200` that contains a `url`. Negative — any other response, including a network error or exceeding the wait limit.'
    ref: config-request
  - term: url
    code: [url]
    summary: The current WebView link from the config response.
    ref: config-request
  - term: expires
    code: [expires]
    summary: The expiry time of the link from the config response.
    ref: config-request
  - term: Conversion data
    match: ['conversion data']
    summary: Install source parameters returned by the AppsFlyer SDK in a callback.
    ref: config-request
  - term: Organic / non-organic install
    match: ['non-organic', 'organic']
    summary: 'The install type given by `af_status`: organic — without an ad source, non-organic (`Non-organic`) — via an ad click.'
    ref: config-request
  - term: AppsFlyer
    match: ['AppsFlyer']
    summary: A mobile install attribution service.
    ref: config-request
  - term: af_id (AppsFlyer ID)
    code: [af_id]
    summary: The install identifier generated by the AppsFlyer SDK on initialization.
    ref: config-request
  - term: Tracking link
    match: ['tracking links?']
    summary: An AppsFlyer link that records the user's click for install attribution.
    ref: app-requirements
  - term: GAID / IDFA
    match: ['GAID', 'IDFA', 'Test Devices']
    summary: 'Device advertising identifiers: GAID — Android, IDFA — iOS. Test Devices — the list of test devices in the AppsFlyer account.'
    ref: app-requirements
  - term: OneLink
    match: ['OneLink']
    summary: A cross-platform AppsFlyer link type with deep linking support.
    ref: onelink
  - term: Unified Deep Linking (UDL)
    match: ['Unified Deep Linking', 'UDL', 'deep linking']
    summary: 'The AppsFlyer mechanism that passes the app the data of the link it was installed or opened from (`deep_link_value`, etc.).'
    ref: config-request
  - term: bundle_id
    code: [bundle_id]
    summary: 'The app identifier: Bundle ID (iOS) or Package Name (Android), e.g. `com.example.app`.'
    ref: config-request
  - term: store_id
    code: [store_id]
    summary: 'The app identifier in the store. For iOS — the Apple ID prefixed with `id`; for Android — the same as `bundle_id`.'
    ref: config-request
  - term: locale
    code: [locale]
    summary: The primary locale of the user's device.
    ref: config-request
  - term: Firebase Cloud Messaging (FCM)
    match: ['Firebase Cloud Messaging', 'Firebase Messaging', 'FCM']
    summary: Google's push notification delivery service.
    ref: notifications
  - term: push_token
    code: [push_token]
    summary: The device's Firebase Messaging registration token.
    ref: config-request
  - term: firebase_project_id
    code: [firebase_project_id]
    summary: 'The Firebase project identifier: Project number or Project ID.'
    ref: config-request
  - term: Service account
    match: ['service accounts?']
    summary: 'A Google Cloud account through which an external service accesses the Firebase project. Notifications use `marla-export@…` and `iosandroidpushes@…`.'
    ref: notifications
  - term: Custom notification prompt screen
    match: ['custom (?:prompt )?screen']
    summary: The app's own screen offering notifications, shown before the system permission prompt.
    ref: notifications
  - term: Notification payload
    match: ['payload']
    code: [payload]
    summary: 'The content of a push notification; its `data` field may carry a `url` link.'
    ref: notifications
  - term: User agent
    match: ['user agent']
    summary: The string the WebView identifies itself to websites with — browser, operating system and device details.
    ref: app-requirements
    anchor: user-agent
  - term: Safe Area
    match: ['Safe Area']
    summary: The screen area where content is not covered by bezels, the camera or system elements.
    ref: app-requirements
  - term: ERR_TOO_MANY_REDIRECTS
    code: [ERR_TOO_MANY_REDIRECTS]
    summary: A page loading error caused by exceeding the allowed number of redirects.
    ref: app-requirements
  - term: Protected Media ID
    match: ['Protected Media ID']
    summary: A permission a page requests to play protected media content.
    ref: app-requirements
  - term: Deep link
    match: ['deep links?(?! data)']
    summary: A link that opens another app or a specific screen in it.
    ref: app-requirements
  - term: Test offer
    match: ['test offer']
    summary: The web.team-s.club resource used to partially test the WebView and app logic.
    ref: app-requirements
  - term: Adaptive icon
    match: ['adaptive icons?']
    summary: An app icon whose image fits its shape exactly — no margins and no cropped content.
    ref: app-requirements
  - term: 16 KB page sizes
    match: ['16 KB page sizes']
    summary: A 16 KB memory page size, support for which Google Play requires from November 1, 2025 for apps targeting Android 15+.
    ref: changelog/android-requirements
