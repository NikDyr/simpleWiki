---
layout: default
---
{%- assign t = site.data.i18n[page.lang] -%}
<article>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
<footer class="meta">
  {%- if site.github.repository_url %}
  <a href="{{ site.github.repository_url }}/edit/{{ site.github.source.branch | default: 'main' }}/{{ page.path }}">✎ {{ t.edit }}</a>
  {%- endif %}
</footer>
