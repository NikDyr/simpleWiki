---
layout: null
---
{%- capture langs -%}{{ site.languages | jsonify }}{%- endcapture -%}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ site.title }}</title>
  <meta http-equiv="refresh" content="1; url={{ '/' | append: site.default_lang | append: '/' | relative_url }}">
  <script>
    (function () {
      var langs = {{ langs }}, base = {{ '/' | relative_url | jsonify }};
      var prefs = (navigator.languages || [navigator.language || ""]).map(function (l) { return l.slice(0, 2).toLowerCase(); });
      var pick = prefs.find(function (l) { return langs.indexOf(l) !== -1; }) || {{ site.default_lang | jsonify }};
      location.replace(base.replace(/\/?$/, "/") + pick + "/");
    })();
  </script>
</head>
<body></body>
</html>
